name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash # explicit bash runs with -o pipefail, so a test piped through tee still fails the step
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      E2E_PORT: 8470
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python (job-local venv with Pillow, for the gate's image decoding)
        run: |
          python3 -m venv .cache/venv
          .cache/venv/bin/pip install --quiet pillow
          echo "$PWD/.cache/venv/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned libraries (no AI models; each file checked against src/vendor.sha256)
        run: node scripts/fetch-vendor.mjs --no-models
      - name: Release files agree (version.js, package.json, CHANGELOG, release notes, README status)
        run: node scripts/release.mjs check
      - name: Third-party notices are current and every pinned file matches its SHA-256
        run: node scripts/notices.mjs --check
      - name: Type check (tsc --checkJs on files marked @ts-check)
        run: npm run typecheck
      - name: Unit and property tests
        run: mkdir -p .cache/status && node tests/check.mjs | tee .cache/status/check.log
      - name: CLI and MCP server
        run: node tests/cli.mjs
      - name: Fuzz (random images and settings, seeded)
        run: node tests/fuzz.mjs 60 369 | tee .cache/status/fuzz.log
      - name: Mutation testing (planted bugs must be caught)
        run: node tests/mutate.mjs | tee .cache/status/mutate.log
      - name: Regression gate on the test images
        run: |
          python3 scripts/prep-images.py
          node tests/bench-test.mjs --gate tests/baseline.json | tee .cache/status/gate.log
      - name: Browser end-to-end
        run: |
          npm install --no-save --no-package-lock --prefix .cache/pw playwright@1.49.1
          npx --prefix .cache/pw playwright install --with-deps chromium
          PORT=$E2E_PORT node scripts/server.cjs & srv=$!
          trap 'kill $srv 2>/dev/null; wait $srv 2>/dev/null || true' EXIT
          for i in $(seq 50); do curl -sf -o /dev/null http://127.0.0.1:$E2E_PORT/ && break; sleep 0.2; done
          # The run is cut in four parts of about equal length (node tests/e2e.cjs --part K). They run at the same time against
          # the one server, each with its own browser and its own log.
          pids=()
          for k in 1 2 3 4; do
            NODE_PATH=.cache/pw/node_modules node tests/e2e.cjs http://127.0.0.1:$E2E_PORT/ --part $k > .cache/status/e2e-$k.log 2>&1 & pids+=($!)
          done
          bad=0; for p in "${pids[@]}"; do wait "$p" || bad=1; done
          for k in 1 2 3 4; do echo "::group::Part $k"; cat .cache/status/e2e-$k.log; echo "::endgroup::"; done
          # status.mjs reads e2e.log: the four logs in part order, and "all passed" only when every part passed
          cat .cache/status/e2e-[1-4].log > .cache/status/e2e.log
          grep -h '^FAIL' .cache/status/e2e-[1-4].log || true
          if [ $bad = 0 ]; then echo "all passed" | tee -a .cache/status/e2e.log; else echo "end to end FAILED" | tee -a .cache/status/e2e.log; exit 1; fi
      - name: Status (the README status block, built from the logs above)
        if: always()
        run: node scripts/status.mjs --logs .cache/status --summary
      # The README status block can be rebuilt from these logs: node scripts/status.mjs --logs <this artifact>
      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-logs
          path: .cache/status/
          if-no-files-found: ignore
